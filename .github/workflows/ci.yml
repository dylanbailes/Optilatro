# CI — full sim test suite + seed-exactness gate.
#
# Runs on every push / PR. The tests live in vendor/balatro-rl (a vendored
# upstream repo) and are run from there via `python -m pytest`.
#
# NOTE: vendor/balatro-rl is tracked as plain content (its nested .git was
# removed at the first commit). If you ever re-vendor from upstream by cloning
# into vendor/balatro-rl again, git will track the new directory as a *gitlink*
# (submodule-style SHA) and check out ZERO files — remove the fresh nested .git
# before committing. The sanity-check step below fails with a clear message
# instead of a confusing pytest error if this ever bites.
#
# The seed-exactness gate (tests/test_seed_exactness.py) is opt-in via the
# `ci_gate` marker (pytest.ini: addopts = -m "not ci_gate"), so the full-suite
# step runs first, then the gate is run explicitly. The gate spawns fresh
# interpreter instances under varying PYTHONHASHSEED and asserts the seed-mode
# draw-log sha256 is byte-identical across them.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Manual trigger — push events occasionally fail to auto-start runs (the
  # webhook can be dropped); workflow_dispatch gives a deterministic way to
  # re-run CI on the current branch head.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full suite + seed-exactness gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: vendor/balatro-rl
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # torch is required by the suite (train_sim.py, pulled in by
          # balatro_sim/tests/test_edge_cases.py). Install from the CPU index:
          # the PyPI wheel bundles CUDA deps (~3 GB) while the CPU wheel is
          # ~200 MB. It stays out of requirements-ci.txt because it needs a
          # different index. First CI run caught the missing-torch failure.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r ../../requirements-ci.txt

      - name: Sanity-check vendored sim is present
        run: test -f balatro_sim/game.py && echo "vendored sim OK"

      - name: Full suite
        run: python -m pytest tests/ balatro_sim/tests/ -q

      # Joker-layer structural audit (joker-fidelity program): fails on
      # duplicate registrations (import-order lottery), dead non-canonical
      # keys, empty stub classes, unresolvable catalogue/spec keys, an effect
      # class contradicting the reference-doc type column, hook overrides
      # whose arity diverges from the JokerEffect base (SIG), inst.state
      # bare-reads without defaults (STATE), or engine-side joker key-scans
      # instead of capability flags (NOSCAN). The spec (tools/joker_spec.json)
      # is generated from balatro-mechanics-reference(2).md by
      # tools/gen_joker_spec.py; behavior is validated by
      # tests/test_joker_spec.py.
      - name: Joker-layer static audit
        working-directory: .
        run: python tools/audit_jokers_static.py

      - name: Seed-exactness gate (cross-process sha256)
        run: python -m pytest tests/test_seed_exactness.py -m ci_gate -v
